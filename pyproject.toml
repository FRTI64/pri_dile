[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipd-tournament"
version = "2.0.0"
description = "100-day iterated prisoner's dilemma strategy toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.7"]

[project.scripts]
ipd = "ipd.cli:main"

[tool.setuptools.packages.find]
include = ["ipd*"]
